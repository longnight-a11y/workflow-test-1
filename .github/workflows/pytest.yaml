name: Run Pytest

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_USER: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
        
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

      - name: Failure log
        if: failure()
        run: echo "The pytest failed"

      - name: Print DB_USER
        run: echo "DB_USER -> ${DB_USER}"

      - name: Print secrets
        run: echo "MY_API_KEY -> ${{ secrets.MY_API_KEY }}"

      - name: Get time
        id: get_time
        run: echo "time=$(date)" >> $GITHUB_OUTPUT

      - name: Print github output
        run: echo "The output of the last step was ${{ steps.get_time.outputs.time }}"